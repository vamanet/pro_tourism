{% extends "base.html" %}{% block title %}Places{% endblock %}
{% block content %}
<div class="page-heading"><h1>Places</h1><div class="actions">↗ ↓</div></div>
<div class="section-title"><strong>All places</strong></div>
<form class="filter" method="get"><input name="q" value="{{ q }}" placeholder="Search places or cities"><select name="category"><option value="">All categories</option>{% for category in categories %}<option value="{{ category }}" {{ 'selected' if selected == category }}>{{ category|capitalize }}</option>{% endfor %}</select><button class="button" type="submit">Filter</button></form>
<div class="cards">{% for place in places %}<a class="card" href="{{ url_for('main.place_detail', place_id=place.id) }}"><div class="card-art"></div><div class="card-body"><h3>{{ place.name }}</h3><p>{{ place.city or 'Unknown city' }} · {{ place.category or 'Place' }}</p><small>View detail →</small></div></a>{% else %}<p class="mono">No places found yet.</p>{% endfor %}</div>
{% endblock %}
