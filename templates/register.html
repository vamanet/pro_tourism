
    {% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
  <div class="card bg-dark border-secondary shadow-sm form-box">
    <h2 class="h3">Create account</h2>
    <form method="POST">
      <label class="form-label" for="username">Username</label>
      <input class="form-control mb-3" id="username" type="text" name="username" placeholder="Username" required>
      <label class="form-label" for="password">Password</label>
      <input class="form-control mb-3" id="password" type="password" name="password" placeholder="Password (min 6)" required>
      <label class="form-label" for="confirm">Confirm password</label>
      <input class="form-control mb-3" id="confirm" type="password" name="confirm" placeholder="Confirm password" required>
      <button class="btn btn-warning" type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('auth.login') }}"><u>Log in</u></a></p>
  </div>
{% endblock %}
