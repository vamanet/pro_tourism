<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in · Explore</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="auth-page">
  <section class="panel auth-card shadow-lg">
    <div class="brand mb-3">Explore<span>.</span></div>
    <h1 class="h3">Welcome back</h1><p>Log in to save and plan your favorite places.</p>
    <form method="post">
      <div class="field"><label for="username">Username</label><input class="form-control" id="username" name="username" required autocomplete="username"></div>
      <div class="field"><label for="password">Password</label><input class="form-control" id="password" name="password" type="password" required autocomplete="current-password"></div>
      <button class="btn btn-warning" type="submit">Log in →</button>
    </form>
  </section>
</body></html>
