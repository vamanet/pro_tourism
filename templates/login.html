<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in · Explore</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="auth-page">
  <section class="panel auth-card">
    <div class="brand">Explore<span>.</span></div>
    <h1>Welcome back</h1><p>Log in to save and plan your favorite places.</p>
    <form method="post">
      <div class="field"><label for="username">Username</label><input id="username" name="username" required autocomplete="username"></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
      <button class="button" type="submit">Log in →</button>
    </form>
  </section>
</body></html>
